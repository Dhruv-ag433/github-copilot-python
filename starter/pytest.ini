[pytest]
# Pytest configuration for Sudoku Flask app

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (use: pytest --cov)
# addopts = --cov=. --cov-report=html --cov-report=term

# Test markers
markers =
    unit: Unit tests for sudoku_logic module
    integration: Integration tests for Flask routes
    slow: Tests that take longer to run
