<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div class="controls">
    <label for="difficulty">Difficulty</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="theme-toggle" type="button">Dark Mode</button>
  </div>
  <div id="sudoku-board"></div>
  <div class="timer-row">
    <span id="timer">Time: 00:00</span>
  </div>
  <div class="controls game-actions">
    <button id="new-game">New Game</button>
    <button id="hint-button">Hint</button>
    <button id="check-solution">Check Solution</button>
  </div>
  <div class="message-row">
    <span id="message"></span>
  </div>
  <section class="leaderboard-panel">
    <div class="leaderboard-header">
      <h2>Top 10 Fastest Times</h2>
      <button id="clear-leaderboard" class="btn-secondary" title="Clear all scores">Clear Scores</button>
    </div>
    <table id="leaderboard">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>Time</th>
          <th>Difficulty</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </section>
  <script src="/static/main.js"></script>
</body>
</html>
